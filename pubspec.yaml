     - assets/icons/Outline/Security/
     - assets/icons/Outline/Settings_Fine_Tuning/
     - assets/icons/Outline/Time/
     - assets/icons/Outline/Video_Audio_Sound/
     - assets/icons/Bold/Arrows/
     - assets/icons/Bold/Call/
     - assets/icons/Bold/Electronic_Devices/
     - assets/icons/Bold/Essentional_UI/
