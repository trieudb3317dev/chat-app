# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "production" ]
  # pull_request:
  #   branches: [ "production" ]

jobs:

  # New job: build Flutter APK and upload as artifact
  build-apk:
    name: Build Android APK and upload artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch full history so we can inspect files reliably
          fetch-depth: 0

      # Debug: show repo files and .flutter-version content to ensure we read correct file
      - name: Debug - list repo and show .flutter-version
        run: |
          echo "pwd: $(pwd)"
          ls -la
          if [ -f .flutter-version ]; then
            echo ".flutter-version content:"
            cat .flutter-version
          else
            echo ".flutter-version not found"
          fi
          echo "Current git branch/ref:"
          git rev-parse --abbrev-ref HEAD || true
          echo "Current commit:"
          git --no-pager log -1 --pretty=SHORT || true
          echo "pubspec.yaml (from workspace):"
          if [ -f pubspec.yaml ]; then
            sed -n '1,120p' pubspec.yaml || true
          else
            echo "pubspec.yaml not found in workspace"
          fi

      - name: Read Flutter version
        id: flutter-version
        run: |
          if [ -f .flutter-version ]; then
            # extract first semantic version-like token (e.g. 3.10.3) and trim CRLF
            ver="$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' .flutter-version | head -n1 | tr -d '\r\n')"
            if [ -n "$ver" ]; then
              echo "Read version: '$ver'"
              echo "flutter_version=$ver" >> $GITHUB_OUTPUT
            else
              echo "No valid version found in .flutter-version, using fallback"
              echo "flutter_version=3.10.3" >> $GITHUB_OUTPUT
            fi
          else
            echo ".flutter-version not found, using fallback"
            echo "flutter_version=3.10.3" >> $GITHUB_OUTPUT
          fi

      - name: Debug - show resolved flutter-version used for setup
        run: |
          echo "Resolved flutter_version='${{ steps.flutter-version.outputs.flutter_version }}'"

      - name: Set up Flutter (use specific version to avoid channel resolution issues)
        uses: subosito/flutter-action@v2
        with:
          # Use version read from .flutter-version (or fallback)
          flutter-version: ${{ steps.flutter-version.outputs.flutter_version }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Debug: verify installed flutter & dart versions
      - name: Verify Flutter & Dart versions
        run: flutter --version

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
