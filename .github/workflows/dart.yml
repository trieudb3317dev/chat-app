# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "production" ]
  # pull_request:
  #   branches: [ "production" ]

jobs:

  # New job: build Flutter APK and upload as artifact
  build-apk:
    name: Build Android APK and upload artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read Flutter version from .flutter-version (fallback to 3.10.6 if missing)
      - name: Read Flutter version
        id: flutter-version
        run: |
          if [ -f .flutter-version ]; then
            echo "flutter_version=$(cat .flutter-version)" >> $GITHUB_OUTPUT
          else
            echo "flutter_version=3.10.6" >> $GITHUB_OUTPUT
          fi

      - name: Set up Flutter (use specific version to avoid channel resolution issues)
        uses: subosito/flutter-action@v2
        with:
          # Use version read from .flutter-version (or fallback)
          flutter-version: ${{ steps.flutter-version.outputs.flutter_version }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
